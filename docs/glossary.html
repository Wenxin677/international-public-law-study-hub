<!DOCTYPE html>

<body>
<header class="topbar" id="topbar"></header>
<main class="wrap">
  <h1 class="km" style="margin-bottom:4px">វាក្យសព្ទច្បាប់ · Legal glossary</h1>
  <p class="muted small km">ពាក្យបច្ចេកទេសទាំងអស់ដែលបានចងក្រងពីមេរៀន — ចុចលើកាត ដើម្បីត្រឡប់មើលនិយមន័យ។</p>

  <div class="card">

<footer class="footer" id="footer"></footer>

    const t = window.IPL.t;
    document.getElementById('mode-table').textContent = t('gloss.listmode');
    document.getElementById('mode-flash').textContent = t('gloss.flashmode');
  });
</script>
