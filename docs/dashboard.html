<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard · RoboCL</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem('robo.theme') || 'dark';
    var lg = localStorage.getItem('robo.lang') === 'en' ? 'en' : 'km';
    document.documentElement.lang = lg; document.documentElement.dataset.bootlang = lg;
  } catch (e) {}
</script>
</head>
<body data-lang="km">
<div id="splash"><div class="slogo"><img src="assets/img/logo.png" alt="RoboCL"><span class="ring"></span></div><div class="lbl">RoboCL</div></div>
<header class="topbar" id="topbar"></header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1 id="greet">—</h1>
      <p class="sub" id="greet-sub"></p>
    </div>

    <div class="grid" style="gap:18px">
      <div class="card" id="prog-card"></div>

      <div class="card" id="continue-card" style="background:linear-gradient(135deg,rgba(111,155,240,.14),rgba(232,180,74,.1))"></div>

      <div>
        <h2 style="font-size:1.15rem" data-t="dash.quick"></h2>
        <div class="grid g4" id="quick"></div>
      </div>

      <div>
        <h2 style="font-size:1.15rem" data-t="dash.chapters"></h2>
        <div class="grid g2" id="chapters"></div>
      </div>

      <div id="notes-card" class="card"></div>

      <div class="row" style="justify-content:flex-end">
        <button class="btn ghost sm" id="reset-btn" data-t="dash.reset"></button>
      </div>
    </div>
  </div>
</main>

<footer class="site" id="footer"></footer>

<script src="data/lessons.js" defer></script>
<script src="assets/js/search.js" defer></script>
<script src="data/config.js" defer></script>
<script src="assets/js/core.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script src="assets/js/data.js" defer></script>
<script src="assets/js/home.js" defer></script>
</body>
</html>
