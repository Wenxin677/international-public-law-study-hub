<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RoboCL — responsive audit (dev only)</title>
<style>
  body { font: 13px/1.5 ui-monospace, monospace; background:#0b1120; color:#dfe7ff; margin:0; padding:14px; }
  pre { white-space: pre-wrap; }
  iframe { border:1px solid #444; }
</style>
</head>
<body>
<pre id="out">running…</pre>
<div id="frames" style="position:fixed;left:-9999px;top:0"></div>
<script>
/* Dev harness: loads every page at phone / tablet widths in an iframe, measures
   horizontal overflow and script errors, and prints a report as text so the
   preview pane's readback can show it.  Deleted before shipping. */
const PAGES = ['index.html','signin.html','dashboard.html','learn.html','quiz.html',
               'teacher.html','library.html','glossary.html','about.html','admin.html'];
const WIDTHS = [360, 390, 768];
const out = document.getElementById('out');
const lines = [];
const log = (s) => { lines.push(s); out.textContent = lines.join('\n'); };

function load(page, w) {
  return new Promise((resolve) => {
    const f = document.createElement('iframe');
    f.style.width = w + 'px';
    f.style.height = '844px';
    f.src = page + (page.indexOf('?') < 0 ? '?' : '&') + '_audit=' + Math.random().toString(36).slice(2);
    f.onload = () => setTimeout(() => resolve(f), 900);
    f.onerror = () => resolve(null);
    document.getElementById('frames').appendChild(f);
    setTimeout(() => resolve(f), 9000);
  });
}

function audit(f, page, w) {
  try {
    const d = f.contentDocument, win = f.contentWindow;
    if (!d) { log(`  ! ${page} @${w}: no document`); return; }
    const de = d.documentElement;
    const overflow = de.scrollWidth - w;
    const bad = [];
    d.querySelectorAll('body *').forEach((el) => {
      const r = el.getBoundingClientRect();
      if (r.width > 0 && (r.right > w + 2 || r.left < -2)) {
        const cs = win.getComputedStyle(el);
        if (cs.position === 'fixed' || cs.display === 'none') return;
        bad.push(`${el.tagName.toLowerCase()}.${(el.className || '').toString().split(' ')[0]} right=${Math.round(r.right)} w=${Math.round(r.width)}`);
      }
    });
    log(`  ${page} @${w}px  scroll=${de.scrollWidth} client=${de.clientWidth} overflow=${overflow > 2 ? 'YES ' + overflow + 'px' : 'no'}` +
        `  errbar=${d.getElementById('err-bar') ? 'YES' : 'no'}` +
        `  splash=${d.getElementById('splash') ? 'left' : 'gone'}` +
        `  text=${(d.body.innerText || '').replace(/\s+/g, ' ').length}ch` +
        `  title="${(d.title || '').slice(0, 42)}"`);
    if (bad.length) log('       wide: ' + bad.slice(0, 6).join(' | '));
  } catch (e) {
    log(`  ! ${page} @${w}: ${e.message}`);
  }
}

(async () => {
  log('RoboCL responsive audit — ' + new Date().toLocaleString());
  /* sign in first so the app pages do not just redirect to signin.html */
  try {
    localStorage.clear(); sessionStorage.clear();
  } catch (e) {}
  const a = document.createElement('iframe');
  a.style.cssText = 'width:900px;height:600px;position:fixed;left:-9999px';
  a.src = 'signin.html?_t=' + Date.now();
  document.getElementById('frames').appendChild(a);
  await new Promise(r => setTimeout(r, 2000));
  try {
    const res = await a.contentWindow.IPLAuth.signup('audit1', 'test1234', 'test1234');
    log('signed in for the audit: ' + JSON.stringify(res.ok));
  } catch (e) { log('sign-in failed: ' + e.message); }
  a.remove();
  for (const page of PAGES) {
    log(page);
    for (const w of WIDTHS) {
      const f = await load(page, w);
      if (!f) { log(`  ! ${page} @${w}: load failed`); continue; }
      audit(f, page, w);
      f.remove();
    }
  }
  log('done');
})();
</script>
</body>
</html>
