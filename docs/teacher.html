<!DOCTYPE html>
<html lang="km" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://*.supabase.co; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>RoboCL · AI Teacher</title>
<link rel="icon" href="assets/img/favicon.png?v=20260912b">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=20260912b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=20260912c">
<script src="assets/js/boot.js?v=20260912c"></script>
</head>
<body data-lang="km">
<div id="splash"><div class="slogo"><img src="assets/img/logo.png?v=20260912b" alt="RoboCL"><span class="ring"></span></div><div class="lbl">RoboCL</div></div>
<header class="topbar" id="topbar"></header>

<main style="padding:0;display:flex;flex-direction:column">
  <h1 class="sr-only" data-t="teacher.title"></h1>
  <div class="chat-shell">
    <aside class="chat-side" id="chat-side"></aside>

    <section class="chat-main">
      <div class="chat-scroll" id="chat-scroll"><div class="thread" id="thread"></div></div>

      <div class="composer-wrap">
        <div class="composer">
          <div class="suggest-row" id="suggest"></div>
          <div class="composer-box">
            <textarea id="chat-text" rows="1" data-t-ph="teacher.placeholder" aria-label="question"></textarea>
            <button class="send" id="send-btn" data-t-title="teacher.send" aria-label="send">➤</button>
          </div>
          <div class="composer-hint">
            <button class="icon-btn chat-side-toggle" id="side-toggle" aria-label="chats">☰</button>
            <button class="btn sm ghost" id="clear-btn">🧹 <span data-t="teacher.clear"></span></button>
            <span class="spacer"></span>
            <span>Enter ⏎ · Shift+Enter ↵</span>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="data/lessons.js?v=20260912c" defer></script>
<script src="data/corpus.js?v=20260912c" defer></script>
<script src="assets/js/search.js?v=20260912c" defer></script>
<script src="data/config.js?v=20260912c" defer></script>
<script src="assets/js/core.js?v=20260912c" defer></script>
<script src="assets/js/progress.js?v=20260912c" defer></script>
<script src="assets/js/auth.js?v=20260912c" defer></script>
<script src="assets/js/data.js?v=20260912c" defer></script>
<script src="assets/js/teacher.js?v=20260912c" defer></script>
</body>
</html>
